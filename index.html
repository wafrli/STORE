<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجري الإلكتروني</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h2>متجري الإلكتروني</h2>
        <div class="nav-links">
            <button onclick="switchTab('store')" class="active">الرئيسية</button>
            <button onclick="switchTab('cart')">سلة الشراء (<span id="cart-count">0</span>)</button>
            <button onclick="switchTab('orders')">طلباتي وفواتيري</button>
        </div>
    </header>

    <div class="container">
        <!-- قسم المتجر والبحث -->
        <div id="store-section">
            <input type="text" id="search-input" class="search-bar" placeholder="ابحث عن الأقسام أو المنتجات..." oninput="handleSearch()">
            
            <h3>الأقسام الرئيسية</h3>
            <div id="categories-container" class="categories"></div>

            <h3 id="products-title">المنتجات</h3>
            <div id="products-container" class="products-grid"></div>
        </div>

        <!-- قسم سلة الشراء والدفع -->
        <div id="cart-section" style="display: none;">
            <h2>سلة الشراء</h2>
            <div id="cart-items"></div>
            <div id="checkout-form" style="margin-top: 2rem; background: white; padding: 1.5rem; border-radius: 0.5rem;">
                <h3>إتمام الطلب</h3>
                <input type="text" id="cust-name" placeholder="اسم المستلم" class="search-bar" style="margin-top: 1rem;">
                <input type="text" id="cust-phone" placeholder="رقم الهاتف" class="search-bar">
                <input type="text" id="cust-city" placeholder="المدينة" class="search-bar">
                <input type="text" id="cust-region" placeholder="المنطقة" class="search-bar">
                
                <label style="display: block; margin: 1rem 0; font-weight: bold;">طريقة الدفع:</label>
                <select id="payment-method" class="search-bar" onchange="togglePaymentGateway()">
                    <option value="cash">نقداً عند الاستلام</option>
                    <option value="electronic">دفع إلكتروني (بوابة الدفع)</option>
                </select>

                <div id="gateway-simulation" style="display: none; background: #e0e7ff; padding: 1rem; border-radius: 0.5rem; margin-bottom: 1rem;">
                    <p>💳 محاكاة بوابة الدفع الإلكتروني (سيتم ربطها بـ API لاحقاً)</p>
                </div>

                <button class="btn" onclick="completeCheckout()">تأكيد وإتمام الطلب</button>
            </div>
        </div>

        <!-- قسم طلباتي والفواتير -->
        <div id="orders-section" style="display: none;">
            <h2>طلباتي السابقة والفواتير</h2>
            <div id="orders-list"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
